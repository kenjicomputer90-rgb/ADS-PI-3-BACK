#spring.datasource.url=jdbc:mysql://10.42.0.112:3306/trajeloc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# CONFIGURAÇÃO ATIVA - BANCO DE DADOS MYSQL (PROJETO TRAJELOC)

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Insira abaixo o usuário e senha do seu MySQL local

# Configurações do Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Executa o script import.sql automaticamente ao iniciar
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# CONFIGURAÇÕES ANTERIORES DO MARIADB (PRESERVADAS PARA HISTÓRICO)

