spring.application.name=trajeloc
server.port=8080


# CONFIGURAÇÃO ATIVA - BANCO DE DADOS MYSQL (PROJETO TRAJELOC)

spring.datasource.url=jdbc:mysql://localhost:3306/trajeloc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Insira abaixo o usuário e senha do seu MySQL local
spring.datasource.username=root
spring.datasource.password=123456

# Configurações do Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update


