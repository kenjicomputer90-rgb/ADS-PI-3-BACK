spring.application.name=trajeloc
server.port=3000


# CONFIGURAÇÃO ATIVA - BANCO DE DADOS MYSQL (PROJETO TRAJELOC)

# Banco e usuário padrão do projeto, criados pelos scripts da pasta BANCO
# (veja o README). São os mesmos do .devcontainer.
spring.datasource.url=jdbc:mysql://localhost:3306/trajeloc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=trajeloc
spring.datasource.password=trajeloc

# Para usar outro banco, usuário ou senha sem alterar este arquivo, defina
# as variáveis de ambiente SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# e SPRING_DATASOURCE_PASSWORD antes de rodar. Elas têm prioridade.
# Não coloque aqui a senha do seu MySQL pessoal: o repositório é público.

# Configurações do Hibernate / JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Executa o script import.sql automaticamente ao iniciar
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
