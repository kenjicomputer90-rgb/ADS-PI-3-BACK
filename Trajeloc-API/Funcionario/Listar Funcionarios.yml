info:
  name: Listar Funcionarios
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/funcionarios"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("devolve pelo menos os 3 funcionários do script do banco", function () {
          expect(res.body.length).to.be.at.least(3);
        });

        test("cada funcionário vem com todos os campos", function () {
          const f = res.body[0];
          expect(f).to.have.property("idFuncionario");
          expect(f).to.have.property("cpf");
          expect(f).to.have.property("salario");
          expect(f).to.have.property("dataNascimento");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5