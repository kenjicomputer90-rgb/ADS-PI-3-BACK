info:
  name: Buscar Funcionario por CPF
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/funcionarios/cpf?valor=555.666.777-88"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("encontra a Juliana Mendes", function () {
          expect(res.body.nome).to.equal("Juliana Mendes");
          expect(res.body.cpf).to.equal("555.666.777-88");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5