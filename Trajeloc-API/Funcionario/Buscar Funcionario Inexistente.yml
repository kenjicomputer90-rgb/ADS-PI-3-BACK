info:
  name: Buscar Funcionario Inexistente
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/funcionarios/999999"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
  scripts:
    - type: tests
      code: |-
        test("explica o erro em JSON", function () {
          expect(res.body.erro).to.include("não encontrado");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5